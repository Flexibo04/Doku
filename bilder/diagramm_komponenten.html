<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Komponentendiagramm – JTL Cloud BI-Tool</title>
  <style>
    body {
      margin: 0;
      background: #ffffff;
      padding: 20px 24px 16px;
      font-family: Arial, sans-serif;
      display: inline-block;
    }
    .diagram-heading { font-size: 13px; font-weight: bold; color: #000; margin-bottom: 4px; }
    .diagram-sub     { font-size: 11px; color: #666; margin-bottom: 14px; }
  </style>
</head>
<body>

<div class="diagram-heading">Komponentendiagramm: Systemarchitektur</div>
<div class="diagram-sub">JTL Cloud BI-Tool · Abschlussprojekt Felix Bock 2026</div>

<svg width="1040" height="462"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, sans-serif"
     style="border:1px solid #ccc; display:block;">

  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.6" fill="#cccccc"/>
    </pattern>
    <!-- open arrowhead — orient="auto" rotates for any line direction -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="arr-d" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666666" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="1040" height="462" fill="url(#dots)"/>
  <rect x="8" y="8" width="1024" height="446" fill="#ffffff" stroke="#cccccc" stroke-width="0.5"/>


  <!-- ═══════════════════════════════════════════════════════
       JTL WAWI APP SHELL
  ═══════════════════════════════════════════════════════ -->
  <rect x="18" y="14" width="1004" height="40"
        fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="520" y="29" text-anchor="middle" font-size="10" font-style="italic" fill="#555555">«subsystem»</text>
  <text x="520" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">JTL Wawi App Shell  (Deployment-Kontext / iframe-Host)</text>

  <!-- AppBridge arrow: downward — orient="auto" rotates arrowhead to point down -->
  <line x1="148" y1="54" x2="148" y2="71"
        stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="158" y="66" font-size="9" fill="#000000">AppBridge  (JWT Session Token)</text>


  <!-- ═══════════════════════════════════════════════════════
       FRONTEND  (blue: #dae8fc / #6c8ebf)
       x=18–288, tab top y=72, body y=92–444
  ═══════════════════════════════════════════════════════ -->
  <path d="M 18,92 L 18,72 L 108,72 L 108,92 L 288,92 L 288,444 L 18,444 Z"
        fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <line x1="18" y1="92" x2="288" y2="92" stroke="#6c8ebf" stroke-width="1"/>
  <text x="63" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Frontend</text>

  <!-- component icon (top-right of body) -->
  <rect x="262" y="98" width="18" height="13" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
  <rect x="257" y="100" width="7" height="3" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
  <rect x="257" y="106" width="7" height="3" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>

  <text x="153" y="113" text-anchor="middle" font-size="10" font-style="italic" fill="#555555">«component»</text>
  <text x="153" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Frontend</text>
  <text x="153" y="142" text-anchor="middle" font-size="10" fill="#444444">React 19 · Vite 8 · TypeScript 6</text>
  <line x1="26" y1="150" x2="280" y2="150" stroke="#6c8ebf" stroke-width="1"/>

  <text x="32" y="168" font-size="10" font-weight="bold" fill="#000000">◆  App.tsx</text>
  <text x="32" y="181" font-size="9" fill="#444444">   Routing · AppBridge-Initialisierung</text>
  <text x="32" y="200" font-size="10" font-weight="bold" fill="#000000">◆  setup-page</text>
  <text x="32" y="213" font-size="9" fill="#444444">   Token-Verifikation · setupCompleted</text>
  <text x="32" y="232" font-size="10" font-weight="bold" fill="#000000">◆  erp-page  (Dashboard)</text>
  <text x="32" y="245" font-size="9" fill="#444444">   KPI-Karten · BarChart (Recharts 3)</text>
  <text x="32" y="258" font-size="9" fill="#444444">   Zeitraumfilter · computeDateRange()</text>
  <text x="32" y="277" font-size="10" font-weight="bold" fill="#000000">◆  api.ts</text>
  <text x="32" y="290" font-size="9" fill="#444444">   createGqlClient() · fetchDashboard()</text>
  <text x="32" y="303" font-size="9" fill="#444444">   5 GraphQL-Queries via Promise.all</text>
  <text x="32" y="322" font-size="10" font-weight="bold" fill="#000000">◆  @jtl-software/cloud-apps-core</text>
  <text x="32" y="335" font-size="9" fill="#444444">   AppBridge SDK · IPC (postMessage)</text>
  <text x="32" y="354" font-size="10" font-weight="bold" fill="#000000">◆  Tailwind CSS 4 · graphql-request 7</text>


  <!-- ═══════════════════════════════════════════════════════
       HTTP ARROWS  (gap x=288–358, 70 px)
  ═══════════════════════════════════════════════════════ -->
  <!-- label above arrows -->
  <text x="323" y="216" text-anchor="middle" font-size="9" font-weight="bold" fill="#000000">HTTP / JSON</text>
  <!-- request arrow (solid) -->
  <line x1="288" y1="226" x2="352" y2="226"
        stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- return arrow (dashed) -->
  <line x1="358" y1="238" x2="294" y2="238"
        stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-d)"/>


  <!-- ═══════════════════════════════════════════════════════
       BACKEND  (green: #d5e8d4 / #82b366)
       x=358–628, tab top y=72, body y=92–444
  ═══════════════════════════════════════════════════════ -->
  <path d="M 358,92 L 358,72 L 448,72 L 448,92 L 628,92 L 628,444 L 358,444 Z"
        fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <line x1="358" y1="92" x2="628" y2="92" stroke="#82b366" stroke-width="1"/>
  <text x="403" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Backend</text>

  <!-- component icon -->
  <rect x="602" y="98" width="18" height="13" fill="#ffffff" stroke="#82b366" stroke-width="1"/>
  <rect x="597" y="100" width="7" height="3" fill="#ffffff" stroke="#82b366" stroke-width="1"/>
  <rect x="597" y="106" width="7" height="3" fill="#ffffff" stroke="#82b366" stroke-width="1"/>

  <text x="493" y="113" text-anchor="middle" font-size="10" font-style="italic" fill="#555555">«component»</text>
  <text x="493" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Backend</text>
  <text x="493" y="142" text-anchor="middle" font-size="10" fill="#444444">Node.js 23 · Express 5 · TypeScript 6</text>
  <line x1="366" y1="150" x2="620" y2="150" stroke="#82b366" stroke-width="1"/>

  <text x="372" y="168" font-size="10" font-weight="bold" fill="#000000">◆  POST /connect-tenant</text>
  <text x="372" y="181" font-size="9" fill="#444444">   Tenant-Verbindung · setupCompleted</text>
  <text x="372" y="200" font-size="10" font-weight="bold" fill="#000000">◆  POST /graphql</text>
  <text x="372" y="213" font-size="9" fill="#444444">   Authentifizierter Proxy → JTL GraphQL</text>
  <text x="372" y="226" font-size="9" fill="#444444">   Header: X-Tenant-ID · Authorization</text>
  <text x="372" y="245" font-size="10" font-weight="bold" fill="#000000">◆  ALL /erp-info/:tenantId/:endpoint</text>
  <text x="372" y="258" font-size="9" fill="#444444">   Generischer REST-Proxy (Erweiterung)</text>
  <text x="372" y="277" font-size="10" font-weight="bold" fill="#000000">◆  verifySessionToken()</text>
  <text x="372" y="290" font-size="9" fill="#444444">   JWKS-Fetch · EdDSA-Verif. (jose 6.x)</text>
  <text x="372" y="303" font-size="9" fill="#444444">   tenantId aus JWT-Payload extrahieren</text>
  <text x="372" y="322" font-size="10" font-weight="bold" fill="#000000">◆  getJwt()</text>
  <text x="372" y="335" font-size="9" fill="#444444">   OAuth2 Client Credentials Flow</text>
  <text x="372" y="348" font-size="9" fill="#444444">   → auth.jtl-cloud.com/oauth2/token</text>


  <!-- ═══════════════════════════════════════════════════════
       HTTPS ARROWS  (gap x=628–698, 70 px)
  ═══════════════════════════════════════════════════════ -->
  <!-- label above arrows -->
  <text x="663" y="216" text-anchor="middle" font-size="9" font-weight="bold" fill="#000000">HTTPS / JSON</text>
  <!-- request arrow (solid) -->
  <line x1="628" y1="226" x2="692" y2="226"
        stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- return arrow (dashed) -->
  <line x1="698" y1="238" x2="634" y2="238"
        stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-d)"/>


  <!-- ═══════════════════════════════════════════════════════
       JTL CLOUD  (external, yellow dashed: #fff2cc / #d6b656)
       x=698–1022, tab top y=72, body y=92–444
  ═══════════════════════════════════════════════════════ -->
  <path d="M 698,92 L 698,72 L 868,72 L 868,92 L 1022,92 L 1022,444 L 698,444 Z"
        fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" stroke-dasharray="9,4"/>
  <line x1="698" y1="92" x2="1022" y2="92" stroke="#d6b656" stroke-width="1"/>
  <text x="783" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">JTL Cloud  «extern»</text>

  <text x="860" y="113" text-anchor="middle" font-size="10" font-style="italic" fill="#555555">«external system»</text>
  <text x="860" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">JTL Cloud</text>
  <text x="860" y="142" text-anchor="middle" font-size="10" fill="#555555">api.jtl-cloud.com</text>
  <line x1="706" y1="150" x2="1014" y2="150" stroke="#d6b656" stroke-width="1"/>

  <!-- Sub-box: GraphQL API -->
  <rect x="710" y="160" width="304" height="82" fill="#ffffff" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="997" y="165" width="11" height="9" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <rect x="993" y="167" width="5" height="2" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <rect x="993" y="171" width="5" height="2" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="862" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">GraphQL API</text>
  <text x="862" y="193" text-anchor="middle" font-size="9"  fill="#444444">/erp/v2/graphql</text>
  <text x="862" y="207" text-anchor="middle" font-size="9"  fill="#666666">Orders · Revenue · KPIs · Stock</text>
  <text x="862" y="220" text-anchor="middle" font-size="9"  fill="#888888">(5 Queries / fetchDashboard)</text>

  <!-- Sub-box: JWKS Endpoint -->
  <rect x="710" y="254" width="304" height="68" fill="#ffffff" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="997" y="259" width="11" height="9" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <rect x="993" y="261" width="5" height="2" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <rect x="993" y="265" width="5" height="2" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="862" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">JWKS-Endpunkt</text>
  <text x="862" y="287" text-anchor="middle" font-size="9"  fill="#444444">/account/.well-known/jwks.json</text>
  <text x="862" y="301" text-anchor="middle" font-size="9"  fill="#666666">EdDSA Public Keys  (Token-Verifikation)</text>

  <!-- Sub-box: Auth Server -->
  <rect x="710" y="334" width="304" height="68" fill="#ffffff" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="997" y="339" width="11" height="9" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <rect x="993" y="341" width="5" height="2" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <rect x="993" y="345" width="5" height="2" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="862" y="353" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Auth-Server  (OAuth2)</text>
  <text x="862" y="367" text-anchor="middle" font-size="9"  fill="#444444">auth.jtl-cloud.com/oauth2/token</text>
  <text x="862" y="381" text-anchor="middle" font-size="9"  fill="#666666">Client Credentials Flow</text>

</svg>

</body>
